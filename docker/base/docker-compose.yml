services:
  postgres:
    image: postgres:13
    container_name: db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ../../.env
    networks:
      - customer_segmentation_project_network  
    volumes:
      - postgres_data:/var/lib/postgresql/data
      -../../data/:/data
  
  nginx:
    image: nginx:latest
    container_name: webserver 
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  
      - static_volume:/app/static
    networks:
      - customer_segmentation_project_network     

volumes:
  postgres_data:
  static_volume:
    external: true

networks:
  customer_segmentation_project_network:
    external: true
